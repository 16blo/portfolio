name: Vérification des fichiers sensibles

on: [push, pull_request]

permissions:
  contents: read

jobs:
  sensitive-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Vérifier les fichiers publics et l’historique
        run: node scripts/check-sensitive-files.mjs --history
